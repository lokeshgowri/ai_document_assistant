<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Document Q&A Assistant</title>

    <!-- Application Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->

    <header class="header">

        <div class="logo-section">

            <div class="logo">
                AI
            </div>

            <div>
                <h1>Document Q&A Assistant</h1>
                <p>Ask questions from your documents</p>
            </div>

        </div>

    </header>


    <!-- Main Application -->

    <main class="app-container">


        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="conversation-section">

                <div class="sidebar-section-header">

                    <h2>Conversations</h2>

                    <button
                        id="newConversationButton"
                        class="new-chat-button"
                        type="button"
                        title="New conversation"
                    >
                        +
                    </button>

                </div>

                <div
                    id="conversationList"
                    class="conversation-list"
                >
                    <p class="empty-conversations">
                        No conversations yet.
                    </p>
                </div>

            </div>

        </aside>


        <!-- Chat -->

        <section class="chat-section">

            <div class="chat-header">

                <div>

                    <h2 id="chatTitle">
                        New Conversation
                    </h2>

                    <p>
                        Ask questions based on your documents.
                    </p>

                </div>

            </div>


            <!-- Chat Messages -->

            <div
                id="chatMessages"
                class="chat-messages"
            >

                <div class="welcome-message">

                    <div class="welcome-icon">
                        🤖
                    </div>

                    <h2>
                        Welcome to Document Q&A
                    </h2>

                    <p>
                        Upload a document using the + button
                        and ask questions about its content.
                    </p>

                </div>

            </div>


            <!-- Example Questions -->

            <div class="example-questions">

                <p>Try asking:</p>

                <button
                    type="button"
                    class="example-question"
                >
                    What is this document about?
                </button>

                <button
                    type="button"
                    class="example-question"
                >
                    What are the important policies?
                </button>

                <button
                    type="button"
                    class="example-question"
                >
                    What are the employee benefits?
                </button>

            </div>


            <!-- Question Input -->

            <div class="chat-input-area">

                <!-- Hidden document input -->

                <input
                    type="file"
                    id="documentInput"
                    accept=".pdf,.docx,.txt"
                    hidden
                >

                <!-- Attachment Button -->

                <button
                    id="attachButton"
                    type="button"
                    class="attach-button"
                    title="Attach document"
                    aria-label="Attach document"
                >
                    📎
                </button>


                <textarea
                    id="questionInput"
                    placeholder="Ask a question about your document..."
                    rows="2"
                ></textarea>


                <button
                    id="askButton"
                    type="button"
                    class="ask-button"
                >
                    Ask
                </button>

            </div>


            <!-- Upload Status -->

            <div
                id="uploadStatus"
                class="upload-status hidden"
            ></div>

        </section>

    </main>


    <script src="js/app.js"></script>

</body>

</html>
